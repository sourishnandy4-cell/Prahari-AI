<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PRAHARI AI — Initializing</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #070a12;
      color: #e4e4e7;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-app-region: drag;
      overflow: hidden;
    }

    /* Ambient background grid & glow */
    .bg-grid {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(6,182,212,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(6,182,212,0.04) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }

    .ambient-radial {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 420px;
      height: 420px;
      background: radial-gradient(circle, rgba(6,182,212,0.12) 0%, rgba(14,165,233,0.02) 50%, transparent 70%);
      border-radius: 50%;
      filter: blur(50px);
      pointer-events: none;
    }

    .card {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      width: 100%;
      max-width: 420px;
      padding: 28px 24px;
      z-index: 10;
    }

    /* Logo container */
    .logo-wrap {
      position: relative;
      width: 80px;
      height: 80px;
      margin-bottom: 20px;
    }

    .logo-glow {
      position: absolute;
      inset: -14px;
      background: radial-gradient(circle, rgba(6,182,212,0.45) 0%, transparent 70%);
      border-radius: 50%;
      animation: pulse-glow 2.4s ease-in-out infinite alternate;
    }

    .logo-box {
      position: absolute;
      inset: 0;
      border-radius: 20px;
      border: 1.5px solid rgba(6,182,212,0.5);
      background: linear-gradient(135deg, rgba(6,182,212,0.15) 0%, rgba(9,20,38,0.9) 100%);
      box-shadow: 0 8px 32px rgba(0,0,0,0.6), inset 0 0 16px rgba(6,182,212,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-icon {
      width: 44px;
      height: 44px;
      color: #38bdf8;
      filter: drop-shadow(0 0 8px rgba(56,189,248,0.6));
    }

    /* Title Block */
    .title-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 16px;
    }

    .title {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 0.12em;
      color: #ffffff;
      text-shadow: 0 2px 10px rgba(0,0,0,0.8);
      line-height: 1.2;
    }

    .subtitle {
      font-size: 10px;
      font-weight: 600;
      color: #94a3b8;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      margin-top: 6px;
      line-height: 1.4;
    }

    /* Sovereign Badge */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 14px;
      border-radius: 99px;
      background: rgba(6,182,212,0.08);
      border: 1px solid rgba(6,182,212,0.3);
      font-size: 10px;
      font-weight: 500;
      color: #38bdf8;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      letter-spacing: 0.08em;
      margin-bottom: 22px;
      box-shadow: 0 2px 8px rgba(6,182,212,0.1);
    }

    .badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #38bdf8;
      box-shadow: 0 0 8px #38bdf8;
      animation: pulse-dot 1.5s ease-in-out infinite;
    }

    /* Progress Section */
    .progress-section {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .progress-wrap {
      width: 240px;
      height: 3px;
      background: rgba(255,255,255,0.08);
      border-radius: 99px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #06b6d4, #38bdf8, #818cf8);
      border-radius: 99px;
      animation: progress-fill 3.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      box-shadow: 0 0 10px rgba(56,189,248,0.7);
    }

    .status-text {
      font-size: 11px;
      color: #64748b;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      letter-spacing: 0.04em;
    }

    /* Typing dots */
    .dots span {
      animation: blink 1.4s infinite;
      opacity: 0;
    }
    .dots span:nth-child(2) { animation-delay: 0.2s; }
    .dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes pulse-glow {
      from { opacity: 0.5; transform: scale(0.92); }
      to   { opacity: 1;   transform: scale(1.08); }
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.4; transform: scale(0.75); }
    }

    @keyframes progress-fill {
      0%   { width: 0%; }
      25%  { width: 35%; }
      60%  { width: 75%; }
      85%  { width: 90%; }
      100% { width: 98%; }
    }

    @keyframes blink {
      0%, 80%, 100% { opacity: 0; }
      40%            { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="ambient-radial"></div>

  <div class="card">
    <!-- Logo -->
    <div class="logo-wrap">
      <div class="logo-glow"></div>
      <div class="logo-box">
        <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96-.44 2.5 2.5 0 0 1-2.96-3.08 3 3 0 0 1-.34-5.58 2.5 2.5 0 0 1 1.32-4.24 2.5 2.5 0 0 1 1.98-3A2.5 2.5 0 0 1 9.5 2Z"/>
          <path d="M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96-.44 2.5 2.5 0 0 0 2.96-3.08 3 3 0 0 0 .34-5.58 2.5 2.5 0 0 0-1.32-4.24 2.5 2.5 0 0 0-1.98-3A2.5 2.5 0 0 0 14.5 2Z"/>
        </svg>
      </div>
    </div>

    <!-- Title Group (Strict Non-Overlapping Layout) -->
    <div class="title-group">
      <h1 class="title">PRAHARI AI</h1>
      <p class="subtitle">Sovereign Industrial Safety Intelligence</p>
    </div>

    <!-- Badge -->
    <div class="badge">
      <div class="badge-dot"></div>
      <span>100% OFFLINE · AIR-GAPPED</span>
    </div>

    <!-- Progress -->
    <div class="progress-section">
      <div class="progress-wrap">
        <div class="progress-bar"></div>
      </div>
      <div class="status-text" id="status">
        Initializing sovereign backend<span class="dots"><span>.</span><span>.</span><span>.</span></span>
      </div>
    </div>
  </div>

  <script>
    const messages = [
      'Initializing sovereign backend',
      'Loading ChromaDB vector store',
      'Starting Agentic RAG engine',
      'Preparing hybrid search index',
      'Launching user interface',
    ];
    let i = 0;
    const statusEl = document.getElementById('status');
    setInterval(() => {
      i = (i + 1) % messages.length;
      statusEl.innerHTML = messages[i] + '<span class="dots"><span>.</span><span>.</span><span>.</span></span>';
    }, 1200);
  </script>
</body>
</html>
