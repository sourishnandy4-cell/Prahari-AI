<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PRAHARI AI — Loading</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #070a12;
      color: #e4e4e7;
      font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-app-region: drag;
      overflow: hidden;
    }

    /* Animated background grid */
    .bg-grid {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(6,182,212,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(6,182,212,0.04) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
    }

    .content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
      z-index: 1;
    }

    /* Logo container */
    .logo-wrap {
      position: relative;
      width: 100px;
      height: 100px;
    }

    .logo-glow {
      position: absolute;
      inset: -20px;
      background: radial-gradient(ellipse at center, rgba(6,182,212,0.3) 0%, transparent 70%);
      border-radius: 50%;
      animation: pulse-glow 2s ease-in-out infinite alternate;
    }

    .logo-ring {
      position: absolute;
      inset: 0;
      border-radius: 24px;
      border: 2px solid rgba(6,182,212,0.4);
      background: linear-gradient(135deg, rgba(6,182,212,0.1) 0%, rgba(14,165,233,0.05) 100%);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-icon {
      width: 52px;
      height: 52px;
      color: #06b6d4;
    }

    /* Text */
    .title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: #f4f4f5;
      text-align: center;
    }

    .subtitle {
      font-size: 11px;
      color: #71717a;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-top: -20px;
      text-align: center;
    }

    /* Progress bar */
    .progress-wrap {
      width: 240px;
      height: 2px;
      background: rgba(255,255,255,0.06);
      border-radius: 99px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #06b6d4, #3b82f6);
      border-radius: 99px;
      animation: progress-fill 4s ease-out forwards;
      box-shadow: 0 0 12px rgba(6,182,212,0.6);
    }

    .status-text {
      font-size: 11px;
      color: #52525b;
      font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
      letter-spacing: 0.05em;
    }

    /* Typing dots */
    .dots span {
      animation: blink 1.4s infinite;
      opacity: 0;
    }
    .dots span:nth-child(2) { animation-delay: 0.2s; }
    .dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes pulse-glow {
      from { opacity: 0.6; transform: scale(0.95); }
      to   { opacity: 1;   transform: scale(1.05); }
    }

    @keyframes progress-fill {
      0%   { width: 0%; }
      20%  { width: 25%; }
      50%  { width: 60%; }
      80%  { width: 85%; }
      100% { width: 95%; }
    }

    @keyframes blink {
      0%, 80%, 100% { opacity: 0; }
      40%            { opacity: 1; }
    }

    /* Badge */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 99px;
      background: rgba(6,182,212,0.08);
      border: 1px solid rgba(6,182,212,0.2);
      font-size: 10px;
      color: #06b6d4;
      font-family: monospace;
      letter-spacing: 0.08em;
    }

    .badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #06b6d4;
      animation: pulse-dot 1.5s ease-in-out infinite;
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.4; transform: scale(0.8); }
    }
  </style>
</head>
<body>
  <div class="bg-grid"></div>

  <div class="content">
    <!-- Logo -->
    <div class="logo-wrap">
      <div class="logo-glow"></div>
      <div class="logo-ring">
        <!-- Brain SVG icon -->
        <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96-.44 2.5 2.5 0 0 1-2.96-3.08 3 3 0 0 1-.34-5.58 2.5 2.5 0 0 1 1.32-4.24 2.5 2.5 0 0 1 1.98-3A2.5 2.5 0 0 1 9.5 2Z"/>
          <path d="M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96-.44 2.5 2.5 0 0 0 2.96-3.08 3 3 0 0 0 .34-5.58 2.5 2.5 0 0 0-1.32-4.24 2.5 2.5 0 0 0-1.98-3A2.5 2.5 0 0 0 14.5 2Z"/>
        </svg>
      </div>
    </div>

    <!-- Title -->
    <div>
      <div class="title">PRAHARI AI</div>
      <div class="subtitle">Sovereign Industrial Safety Intelligence</div>
    </div>

    <!-- Badge -->
    <div class="badge">
      <div class="badge-dot"></div>
      100% Offline · Air-Gapped
    </div>

    <!-- Progress -->
    <div style="display:flex;flex-direction:column;align-items:center;gap:12px;">
      <div class="progress-wrap">
        <div class="progress-bar"></div>
      </div>
      <div class="status-text" id="status">
        Initializing sovereign backend<span class="dots"><span>.</span><span>.</span><span>.</span></span>
      </div>
    </div>
  </div>

  <script>
    // Cycle through loading status messages
    const messages = [
      'Initializing sovereign backend',
      'Loading ChromaDB vector store',
      'Starting Agentic RAG engine',
      'Preparing hybrid search index',
      'Launching UI interface',
    ];
    let i = 0;
    const statusEl = document.getElementById('status');
    setInterval(() => {
      i = (i + 1) % messages.length;
      statusEl.innerHTML = messages[i] + '<span class="dots"><span>.</span><span>.</span><span>.</span></span>';
    }, 1400);
  </script>
</body>
</html>
